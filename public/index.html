<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>远齐SSO协议测试</title>
  <link href="/lib/bootstrap-5.3.3/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5">
    <div class="text-center mb-5">
      <h1 class="display-5">远齐SSO单点登录协议测试</h1>
      <p class="text-muted">选择要测试的协议</p>
    </div>

    <div class="row g-4 justify-content-center">
      <div class="col-md-5 col-lg-4">
        <div class="card h-100 shadow-sm">
          <div class="card-body text-center">
            <h4 class="card-title">OAuth 2.0</h4>
            <p class="card-text text-muted small">标准授权协议测试，支持静默/手动授权模式</p>
            <a href="/oauth2.html" class="btn btn-primary">开始测试</a>
          </div>
        </div>
      </div>
      <div class="col-md-5 col-lg-4">
        <div class="card h-100 shadow-sm">
          <div class="card-body text-center">
            <h4 class="card-title">OIDC</h4>
            <p class="card-text text-muted small">OIDC 身份认证协议测试</p>
            <a href="/oidc.html" class="btn btn-primary">开始测试</a>
          </div>
        </div>
      </div>
      <div class="col-md-5 col-lg-4">
        <div class="card h-100 shadow-sm">
          <div class="card-body text-center">
            <h4 class="card-title">CAS 2.0</h4>
            <p class="card-text text-muted small">中央认证服务协议测试</p>
            <a href="/cas.html" class="btn btn-primary">开始测试</a>
          </div>
        </div>
      </div>
      <div class="col-md-5 col-lg-4">
        <div class="card h-100 shadow-sm">
          <div class="card-body text-center">
            <h4 class="card-title">SAML 2.0</h4>
            <p class="card-text text-muted small">安全断言标记语言协议测试</p>
            <a href="/saml.html" class="btn btn-primary">开始测试</a>
          </div>
        </div>
      </div>
      <div class="col-md-5 col-lg-4">
        <div class="card h-100 shadow-sm">
          <div class="card-body text-center">
            <h4 class="card-title">旧版远齐 SSO</h4>
            <p class="card-text text-muted small">远齐旧版单点登录协议测试</p>
            <a href="/yuanqi.html" class="btn btn-primary">开始测试</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
